# Publishes the site artifact produced by a fork pull request. This workflow is defined on main
# and never checks out or executes the fork. It only copies the already built files to gh-pages
# after the pull request head matches the run that uploaded them.
name: Pages preview from fork

on:
  workflow_run:
    workflows: ['CI and Pages']
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      # Only trusted main code runs with write permissions. Never check out the fork.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        id: plan
        with:
          script: |
            const { default: plan } = await import(process.env.GITHUB_WORKSPACE + '/tools/preview-plan.mjs');
            await plan({ github, context, core });

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: steps.plan.outputs.mode == 'deploy'
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: preview-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1
        id: preview
        if: steps.plan.outputs.mode == 'deploy' || steps.plan.outputs.mode == 'remove'
        with:
          source-dir: preview-site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ steps.plan.outputs.number }}
          action: ${{ steps.plan.outputs.mode }}
          comment: false
          deploy-commit-message: Deploy preview for PR ${{ steps.plan.outputs.number }}
          remove-commit-message: Remove preview for PR ${{ steps.plan.outputs.number }}

      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        if: steps.plan.outputs.mode == 'deploy'
        with:
          header: pr-preview
          number: ${{ steps.plan.outputs.number }}
          message: |
            Preview: ${{ steps.preview.outputs.preview-url }}

            Built from this pull request. The page is removed when the pull request closes.

      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        if: steps.plan.outputs.mode == 'remove'
        with:
          header: pr-preview
          number: ${{ steps.plan.outputs.number }}
          message: Preview removed because the pull request was closed.
