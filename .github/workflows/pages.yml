# Checks every push and pull request. On main it publishes the browser build to GitHub Pages
# (gh-pages branch, site root). A pull request from this repository publishes a preview under
# /pr-preview/pr-<number>/ and removes it when the pull request closes. A pull request from a
# fork only uploads the built site; pages-preview-fork.yml publishes that artifact.
name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Merging a PR fires "push" on main and "pull_request closed" at the same
  # time; key PR runs by number so the cleanup never cancels the main deploy.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}/pr-preview/pr-{1}/', github.event.repository.name, github.event.number) || format('/{0}/', github.event.repository.name) }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      # The browser suite builds and tests the exact artifact uploaded below.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright
          path: test-results/
      - uses: actions/upload-artifact@v5
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: web-dist
          path: site
          include-hidden-files: true
          retention-days: 3
      # Fork pull requests cannot push to gh-pages. The artifact name carries the pull request
      # number, because the workflow_run event does not include it for a fork.
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: site
          include-hidden-files: true
          retention-days: 3

  # Closing a fork pull request has nothing to build. The marker tells the publisher to remove
  # the preview. The job never checks out the fork.
  fork-preview-close:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p marker && echo remove > marker/remove.txt
      - uses: actions/upload-artifact@v5
        with:
          name: preview-remove-pr-${{ github.event.pull_request.number }}
          path: marker
          retention-days: 1

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: gh-pages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: site
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          # Keep the pull request previews that live next to the site.
          clean-exclude: pr-preview/
          force: false

  preview:
    needs: check
    # Same-repository PRs only: forks cannot push to gh-pages.
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    concurrency: gh-pages
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: plan
        with:
          script: |
            const { default: plan } = await import(process.env.GITHUB_WORKSPACE + '/tools/preview-plan.mjs');
            await plan({ github, context, core });
      - uses: actions/download-artifact@v5
        if: steps.plan.outputs.mode == 'deploy'
        with:
          name: web-dist
          path: preview-site
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1
        if: steps.plan.outputs.mode != ''
        with:
          source-dir: preview-site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: ${{ steps.plan.outputs.mode }}
          qr-code: false
